<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scape — Polls</title>
<style>
  :root {
    --parchment: #c8b88a;
    --parchment-dark: #b0a070;
    --parchment-darker: #8f7f58;
    --stone: #5c5445;
    --stone-dark: #3a352e;
    --stone-light: #7a7060;
    --gold: #ff981f;
    --gold-dim: #c8842a;
    --text: #000;
    --ink: #2a2015;
    --mono: 'Courier New', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: var(--mono);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ink);
  }
  #site-header {
    display: flex;
    align-items: center;
    background: var(--stone-dark);
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
    border-bottom: 1px solid var(--stone);
    width: 100%;
  }
  #site-header .logo {
    color: var(--gold);
    font-weight: bold;
    font-size: 14px;
    margin-right: 16px;
    text-decoration: none;
    letter-spacing: 2px;
  }
  #site-header nav {
    display: flex;
    flex: 1;
  }
  #site-header nav a {
    color: #aaa;
    text-decoration: none;
    padding: 0 10px;
    line-height: 30px;
  }
  #site-header nav a:hover { color: #fff; }
  #site-header nav a.active { color: var(--gold); }

  .content {
    width: 100%;
    max-width: 820px;
    background: var(--parchment);
    flex: 1;
    padding: 20px;
    color: var(--text);
  }

  h1 {
    color: var(--stone-dark);
    font-size: 22px;
    margin-bottom: 8px;
    border-bottom: 2px solid var(--parchment-dark);
    padding-bottom: 6px;
    letter-spacing: 1px;
  }

  .filter-bar {
    display: flex;
    gap: 4px;
    margin: 14px 0;
  }
  .filter-btn {
    padding: 4px 12px;
    background: var(--parchment-dark);
    border: 1px solid var(--parchment-darker);
    color: var(--ink);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .filter-btn:hover { background: var(--parchment-darker); }
  .filter-btn.active {
    background: var(--stone-dark);
    color: var(--gold);
  }

  .poll {
    background: #efe2b8;
    border: 1px solid var(--parchment-darker);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .poll.closed { opacity: 0.82; }

  .poll-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .poll-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--stone-dark);
    flex: 1;
  }
  .poll-meta {
    font-size: 11px;
    color: var(--stone);
    text-align: right;
    white-space: nowrap;
    margin-left: 10px;
  }
  .poll-meta .status-open { color: #2a6e2a; font-weight: bold; }
  .poll-meta .status-closed { color: #8b0000; font-weight: bold; }

  .option {
    margin: 6px 0;
    font-size: 12px;
  }
  .option .label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .option .label .name {
    color: var(--ink);
    font-weight: bold;
  }
  .option .label .count {
    color: var(--stone);
    font-family: var(--mono);
  }
  .bar-outer {
    width: 100%;
    height: 12px;
    background: rgba(0,0,0,0.1);
    border: 1px solid var(--parchment-darker);
    position: relative;
  }
  .bar-inner {
    height: 100%;
    background: linear-gradient(to right, var(--gold-dim), var(--gold));
  }
  .bar-inner.winner { background: linear-gradient(to right, #8b6914, var(--gold)); }

  .poll-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .poll-actions select, .poll-actions input {
    padding: 4px 8px;
    background: #efe2b8;
    border: 1px solid var(--parchment-darker);
    font-family: var(--mono);
    font-size: 12px;
  }
  .poll-actions button {
    padding: 4px 12px;
    background: var(--stone-dark);
    color: var(--gold);
    border: 1px solid var(--stone);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .poll-actions button:hover { background: var(--stone); }
  .poll-actions button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .winner-tag {
    color: var(--gold-dim);
    font-weight: bold;
    margin-top: 6px;
    font-size: 12px;
  }
  .tie-tag {
    color: var(--stone-dark);
    font-weight: bold;
    margin-top: 6px;
    font-size: 12px;
  }

  .empty {
    padding: 20px;
    text-align: center;
    color: var(--stone);
    font-style: italic;
  }
  .error { color: #8b0000; margin-top: 6px; font-size: 11px; }
  .success { color: #2a6e2a; margin-top: 6px; font-size: 11px; }

  .note {
    font-size: 11px;
    color: var(--stone);
    margin-top: 8px;
    font-style: italic;
  }
</style>
</head>
<body>
<div id="site-header">
  <a class="logo" href="/">SCAPE</a>
  <nav>
    <a href="/">Watch</a>
    <a href="/play">Play</a>
    <a href="/guide">Guide</a>
    <a href="/hiscores">Hiscores</a>
    <a href="/polls" class="active">Polls</a>
    <a href="/about">About</a>
  </nav>
</div>

<div class="content">
  <h1>Community Polls</h1>
  <div style="font-size:12px;color:var(--stone);margin-bottom:6px">
    Vote on community decisions. Secret ballot — only aggregate counts are ever shown.
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="closed">Closed</button>
    <button class="filter-btn" data-filter="all">All</button>
  </div>

  <div id="polls-list"></div>

  <p class="note">
    To vote in-game, type <code>/poll vote &lt;id&gt; &lt;option&gt;</code>.
    Admins: <code>/poll create "title" opt1,opt2</code>.
  </p>
</div>

<script>
  let currentFilter = 'active';
  let currentPlayer = '';  // set on first vote attempt

  function qs(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function fmtTime(ms) {
    if (!ms) return 'never';
    const diff = ms - Date.now();
    if (diff <= 0) return 'expired';
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h`;
    const m = Math.floor((diff % 3600000) / 60000);
    return `${m}m`;
  }

  async function fetchJson(url, opts) {
    try {
      const r = await fetch(url, opts);
      const data = await r.json();
      if (!r.ok) return { error: data.error || `HTTP ${r.status}` };
      return data;
    } catch (e) {
      return { error: e.message };
    }
  }

  function renderPoll(poll, results) {
    const totalVotes = results.total;
    let winnerIdx = -1;
    let winnerCount = -1;
    for (const r of results.results) {
      if (r.count > winnerCount) { winnerIdx = r.index; winnerCount = r.count; }
    }

    const opts = results.results.map(r => {
      const isWinner = !results.tie && r.count > 0 && r.index === winnerIdx;
      return `<div class="option">
        <div class="label">
          <span class="name">[${r.index}] ${escapeHtml(r.label)}</span>
          <span class="count">${r.count} (${r.pct}%)</span>
        </div>
        <div class="bar-outer">
          <div class="bar-inner${isWinner ? ' winner' : ''}" style="width:${r.pct}%"></div>
        </div>
      </div>`;
    }).join('');

    const status = poll.closed
      ? `<span class="status-closed">CLOSED</span>`
      : `<span class="status-open">closes in ${fmtTime(poll.closesAt)}</span>`;

    const winnerLine = results.winner
      ? `<div class="winner-tag">Winner: ${escapeHtml(results.winner)}</div>`
      : results.tie ? `<div class="tie-tag">Result: tie</div>` : '';

    const actions = poll.closed ? '' : `
      <div class="poll-actions">
        <input type="text" class="p-name" placeholder="your name" value="${escapeHtml(currentPlayer)}" style="width:120px">
        <select class="p-opt">
          ${poll.options.map((o, i) => `<option value="${i}">[${i}] ${escapeHtml(o)}</option>`).join('')}
        </select>
        <button class="p-vote" data-id="${poll.id}">Vote</button>
        <button class="p-unvote" data-id="${poll.id}">Retract</button>
        <span class="result-msg"></span>
      </div>
    `;

    return `<div class="poll ${poll.closed ? 'closed' : ''}" data-id="${poll.id}">
      <div class="poll-header">
        <div class="poll-title">#${poll.id}: ${escapeHtml(poll.title)}</div>
        <div class="poll-meta">
          ${status}<br>
          by ${escapeHtml(poll.createdByName)} • ${totalVotes} vote${totalVotes === 1 ? '' : 's'}
        </div>
      </div>
      ${opts}
      ${winnerLine}
      ${actions}
    </div>`;
  }

  async function render() {
    const container = qs('polls-list');
    container.innerHTML = '<div class="empty">Loading...</div>';
    const data = await fetchJson('/api/polls?filter=' + currentFilter);
    if (data.error) {
      container.innerHTML = `<div class="empty">${escapeHtml(data.error)}</div>`;
      return;
    }
    if (!data.polls || data.polls.length === 0) {
      container.innerHTML = '<div class="empty">No polls to show.</div>';
      return;
    }

    // Fetch results for each (already cached server-side).
    const html = [];
    for (const poll of data.polls) {
      const d = await fetchJson('/api/polls/' + poll.id);
      if (d.error || !d.results) {
        html.push(`<div class="poll"><div class="poll-title">#${poll.id}: ${escapeHtml(poll.title)}</div><div class="error">${escapeHtml(d.error || 'failed')}</div></div>`);
      } else {
        html.push(renderPoll(d.poll, d.results));
      }
    }
    container.innerHTML = html.join('');
    wirePollActions();
  }

  function wirePollActions() {
    for (const b of document.querySelectorAll('.p-vote')) {
      b.addEventListener('click', async () => {
        const poll = b.closest('.poll');
        const id = parseInt(b.getAttribute('data-id'), 10);
        const nameInp = poll.querySelector('.p-name');
        const optSel = poll.querySelector('.p-opt');
        const msg = poll.querySelector('.result-msg');
        const name = (nameInp.value || '').trim();
        if (!name) { msg.className = 'error'; msg.textContent = 'Enter your name.'; return; }
        currentPlayer = name;
        // Player id for the web form is the player's name (server-side handles
        // either numeric id or string name). Pass as playerId.
        const r = await fetchJson('/api/polls/' + id + '/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: name, choice: parseInt(optSel.value, 10) }),
        });
        if (r.error) { msg.className = 'error'; msg.textContent = r.error; }
        else { msg.className = 'success'; msg.textContent = 'Vote recorded.'; render(); }
      });
    }
    for (const b of document.querySelectorAll('.p-unvote')) {
      b.addEventListener('click', async () => {
        const poll = b.closest('.poll');
        const id = parseInt(b.getAttribute('data-id'), 10);
        const nameInp = poll.querySelector('.p-name');
        const msg = poll.querySelector('.result-msg');
        const name = (nameInp.value || '').trim();
        if (!name) { msg.className = 'error'; msg.textContent = 'Enter your name.'; return; }
        const r = await fetchJson('/api/polls/' + id + '/unvote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: name }),
        });
        if (r.error) { msg.className = 'error'; msg.textContent = r.error; }
        else { msg.className = 'success'; msg.textContent = 'Retracted.'; render(); }
      });
    }
  }

  function wireFilters() {
    for (const b of document.querySelectorAll('.filter-btn')) {
      b.addEventListener('click', () => {
        for (const x of document.querySelectorAll('.filter-btn')) x.classList.remove('active');
        b.classList.add('active');
        currentFilter = b.getAttribute('data-filter');
        render();
      });
    }
  }

  (function init() {
    wireFilters();
    render();
  })();
</script>
</body>
</html>
