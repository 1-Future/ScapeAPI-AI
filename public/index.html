<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scape</title>
<style>
  :root {
    --parchment: #c8b88a;
    --parchment-dark: #b0a070;
    --stone: #5c5445;
    --stone-dark: #3a352e;
    --stone-light: #7a7060;
    --border-bevel-light: #8a7d6b;
    --border-bevel-dark: #2a2520;
    --gold: #ff981f;
    --gold-dim: #c8842a;
    --text: #000;
    --text-system: #0000aa;
    --text-player: #000099;
    --text-game: #000;
    --text-trade: #7e3f00;
    --text-clan: #005f00;
    --tab-bg: #3b3024;
    --tab-active: #5a4a35;
    --tab-text: #ff981f;
    --tab-on: #00cc00;
    --input-bg: #c8b88a;
    --mono: 'Courier New', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: var(--text);
    font-family: var(--mono);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
  }

  /* Game container — chatbox style */
  #game-container {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  /* Game viewport (top area — black, for future map/3d) */
  #viewport {
    flex: 1;
    background: #0a0a08;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid var(--stone-dark);
    position: relative;
    overflow: hidden;
  }
  #viewport-content {
    font-family: var(--mono);
    font-size: 11px;
    color: #888;
    white-space: pre;
    line-height: 1.2;
    letter-spacing: 0.5px;
    padding: 8px;
    overflow: auto;
    width: 100%;
    height: 100%;
  }

  /* Chat panel — the OSRS chatbox */
  #chatbox {
    width: 100%;
    background: var(--parchment);
    border: 3px solid var(--stone);
    border-bottom: none;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 200px;
    position: relative;
    /* Bevel effect */
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.15),
      inset -2px -2px 0 rgba(0,0,0,0.3);
  }

  /* Stone column borders */
  #chatbox::before, #chatbox::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 28px;
    width: 6px;
    background: linear-gradient(90deg, var(--stone-dark), var(--stone-light), var(--stone-dark));
    z-index: 2;
  }
  #chatbox::before { left: 0; }
  #chatbox::after { right: 14px; }

  /* Chat log */
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 4px 24px 4px 14px;
    font-size: 12px;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: var(--stone) var(--parchment-dark);
  }
  #chat-log::-webkit-scrollbar { width: 12px; }
  #chat-log::-webkit-scrollbar-track { background: var(--parchment-dark); border-left: 1px solid var(--stone); }
  #chat-log::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--stone-light), var(--stone), var(--stone-dark));
    border: 1px solid var(--stone-dark);
  }
  #chat-log::-webkit-scrollbar-button { display: block; height: 12px; background: var(--stone); border: 1px solid var(--stone-dark); }

  /* Chat messages */
  .msg { padding: 1px 0; color: var(--text); }
  .msg.player { color: var(--text-player); }
  .msg.player::before { content: '> '; color: var(--text-player); }
  .msg.system { color: var(--text-system); }
  .msg.ascii {
    font-size: 10px;
    line-height: 1.15;
    letter-spacing: 0.3px;
    color: #333;
  }

  /* Input row */
  #input-row {
    display: flex;
    align-items: center;
    padding: 2px 8px 2px 14px;
    background: var(--parchment);
    border-top: 1px solid var(--parchment-dark);
    min-height: 20px;
  }
  #input-label {
    color: var(--text);
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    margin-right: 4px;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-player);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 0;
  }

  /* Tab bar — bottom */
  #tabs {
    display: flex;
    background: var(--tab-bg);
    border-top: 2px solid var(--stone-dark);
    height: 28px;
    flex-shrink: 0;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.05);
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    color: #ccc;
    cursor: pointer;
    border-right: 1px solid var(--stone-dark);
    user-select: none;
    line-height: 1.1;
    padding: 0 2px;
  }
  .tab:last-child { border-right: none; }
  .tab:hover { background: rgba(255,255,255,0.05); }
  .tab.active { color: var(--gold); background: var(--tab-active); }
  .tab small { color: var(--tab-on); font-size: 8px; }
  .tab.report { color: #fff; background: #802020; font-weight: bold; }
  .tab.report:hover { background: #a03030; }

  /* Quick action pills (above tabs) */
  #quick-bar {
    display: flex;
    background: var(--stone-dark);
    padding: 3px 4px;
    gap: 3px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .qbtn {
    background: var(--tab-bg);
    border: 1px solid var(--stone);
    color: var(--gold-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.08), inset -1px -1px 0 rgba(0,0,0,0.2);
  }
  .qbtn:hover { background: var(--tab-active); color: var(--gold); }
  .qbtn:active { box-shadow: inset -1px -1px 0 rgba(255,255,255,0.08), inset 1px 1px 0 rgba(0,0,0,0.2); }

  /* Timer display */
  #timer {
    background: #111;
    color: #aaa;
    font-family: var(--mono);
    font-size: 10px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--stone-dark);
  }

  /* Login overlay */
  #login-overlay {
    position: fixed; inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 12px;
  }
  #login-overlay h1 {
    font-size: 32px;
    color: var(--gold);
    letter-spacing: 4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #login-overlay .sub {
    color: #666;
    font-size: 11px;
    margin-bottom: 12px;
  }
  #login-overlay input {
    background: var(--parchment);
    border: 2px solid var(--stone);
    color: #000;
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 16px;
    width: 220px;
    text-align: center;
    outline: none;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.15);
  }
  #login-overlay input:focus { border-color: var(--gold); }
  #login-overlay button {
    background: linear-gradient(180deg, #5a8a3a, #3a6a2a);
    color: #fff;
    border: 2px solid #2a4a1a;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: bold;
    padding: 8px 40px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.2), inset -1px -1px 0 rgba(0,0,0,0.3);
  }
  #login-overlay button:hover { background: linear-gradient(180deg, #6a9a4a, #4a7a3a); }
  #login-overlay .domain { position: absolute; bottom: 12px; color: #333; font-size: 9px; letter-spacing: 1px; }

  /* Desktop: side by side */
  @media (min-width: 768px) {
    #game-container { max-width: 520px; height: 100dvh; }
    #chatbox { height: 240px; }
  }
  @media (max-width: 400px) {
    #chat-log { font-size: 11px; }
    .msg.ascii { font-size: 9px; }
    .tab { font-size: 9px; }
  }
</style>
</head>
<body>

<div id="login-overlay">
  <h1>SCAPE</h1>
  <div class="sub">command-based mmorpg</div>
  <input id="login-name" type="text" placeholder="Enter username" maxlength="20" autocomplete="off" spellcheck="false">
  <button onclick="doLogin()">PLAY NOW</button>
  <div class="domain">sc4p3.com</div>
</div>

<div id="game-container">
  <!-- Top: game viewport (map/ascii) -->
  <div id="viewport">
    <div id="viewport-content"></div>
  </div>

  <!-- Bottom: OSRS-style chatbox -->
  <div id="chatbox">
    <div id="chat-log"></div>
    <div id="input-row">
      <span id="input-label"></span>
      <input id="input" type="text" placeholder="" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <!-- Quick actions -->
  <div id="quick-bar">
    <button class="qbtn" onclick="send('/?')">/?</button>
    <button class="qbtn" onclick="send('n')">N</button>
    <button class="qbtn" onclick="send('s')">S</button>
    <button class="qbtn" onclick="send('e')">E</button>
    <button class="qbtn" onclick="send('w')">W</button>
    <button class="qbtn" onclick="send('inv')">Inv</button>
    <button class="qbtn" onclick="send('map')">Map</button>
    <button class="qbtn" onclick="send('status')">Stats</button>
    <button class="qbtn" onclick="send('look')">Look</button>
  </div>

  <!-- OSRS-style tabs -->
  <div id="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="game">Game<br><small>On</small></div>
    <div class="tab" data-filter="public">Public<br><small>On</small></div>
    <div class="tab" data-filter="private">Private<br><small>On</small></div>
    <div class="tab" data-filter="channel">Channel<br><small>On</small></div>
    <div class="tab" data-filter="clan">Clan<br><small>On</small></div>
    <div class="tab" data-filter="trade">Trade<br><small>On</small></div>
    <div id="timer">00:00:00</div>
  </div>
</div>

<script>
const chatLog = document.getElementById('chat-log');
const input = document.getElementById('input');
const inputLabel = document.getElementById('input-label');
const loginOverlay = document.getElementById('login-overlay');
const loginNameEl = document.getElementById('login-name');
const viewportContent = document.getElementById('viewport-content');
const timerEl = document.getElementById('timer');

let ws = null;
let playerName = '';
let connected = false;
let loginTime = 0;

function isAscii(text) {
  if (text.includes('@') && text.includes('Legend:')) return true;
  if ((text.match(/[.=#~XSTDP!?@>]/g) || []).length > text.length * 0.25 && text.split('\n').length > 5) return true;
  return false;
}

function addMsg(text, type) {
  // If it's a map/ascii, show in viewport instead
  if (type === 'game' && isAscii(text)) {
    viewportContent.textContent = text;
    return;
  }

  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;

  // Keep log manageable
  while (chatLog.children.length > 200) chatLog.removeChild(chatLog.firstChild);
}

function send(cmd) {
  if (!ws || !connected) return;
  ws.send(cmd);
  addMsg(cmd, 'player');
}

function sendInput() {
  const val = input.value.trim();
  if (!val) return;
  send(val);
  input.value = '';
}

function connect() {
  const host = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? `ws://${location.hostname}:2223`
    : `ws://${location.host}`;

  ws = new WebSocket(host);

  ws.onopen = () => {
    connected = true;
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.text) {
      if (msg.text.includes('Welcome to Scape') && loginOverlay.style.display !== 'none') return;
      addMsg(msg.text, 'game');
    }
  };

  ws.onclose = () => {
    connected = false;
    addMsg('Connection lost.', 'system');
    setTimeout(() => location.reload(), 3000);
  };
}

function doLogin() {
  playerName = loginNameEl.value.trim() || `Player${Math.floor(Math.random() * 9999)}`;
  loginOverlay.style.display = 'none';
  inputLabel.textContent = playerName + ':';
  loginTime = Date.now();
  connect();
  const waitLogin = setInterval(() => {
    if (connected) {
      ws.send(`login ${playerName}`);
      clearInterval(waitLogin);
    }
  }, 100);
}

// Timer
setInterval(() => {
  if (!loginTime) return;
  const elapsed = Math.floor((Date.now() - loginTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  timerEl.textContent = `${h}:${m}:${s}`;
}, 1000);

// Tab switching (visual only for now)
document.querySelectorAll('.tab[data-filter]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

loginNameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendInput(); });
document.addEventListener('keydown', (e) => {
  if (loginOverlay.style.display !== 'none') return;
  if (e.target === input) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) input.focus();
});
</script>
</body>
</html>
