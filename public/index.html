<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scape</title>
<style>
  :root {
    --parchment: #c8b88a;
    --parchment-dark: #b0a070;
    --stone: #5c5445;
    --stone-dark: #3a352e;
    --stone-light: #7a7060;
    --border-bevel-light: #8a7d6b;
    --border-bevel-dark: #2a2520;
    --gold: #ff981f;
    --gold-dim: #c8842a;
    --text: #000;
    --text-system: #0000aa;
    --text-player: #000099;
    --text-game: #000;
    --text-trade: #7e3f00;
    --text-clan: #005f00;
    --tab-bg: #3b3024;
    --tab-active: #5a4a35;
    --tab-text: #ff981f;
    --tab-on: #00cc00;
    --input-bg: #c8b88a;
    --mono: 'Courier New', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: var(--text);
    font-family: var(--mono);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
  }

  /* Game container — chatbox style */
  #game-container {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  /* No separate viewport — chatbox is fullscreen */

  /* Chat panel — the OSRS chatbox */
  #chatbox {
    width: 100%;
    background: var(--parchment);
    border: 3px solid var(--stone);
    border-bottom: none;
    display: flex;
    flex-direction: column;
    flex: 1;
    position: relative;
    /* Bevel effect */
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.15),
      inset -2px -2px 0 rgba(0,0,0,0.3);
  }

  /* No stone columns — clean full-width parchment */

  /* Chat log */
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 4px 24px 4px 14px;
    font-size: 12px;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: var(--stone) var(--parchment-dark);
  }
  #chat-log::-webkit-scrollbar { width: 12px; }
  #chat-log::-webkit-scrollbar-track { background: var(--parchment-dark); border-left: 1px solid var(--stone); }
  #chat-log::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--stone-light), var(--stone), var(--stone-dark));
    border: 1px solid var(--stone-dark);
  }
  #chat-log::-webkit-scrollbar-button { display: block; height: 12px; background: var(--stone); border: 1px solid var(--stone-dark); }

  /* Chat messages */
  .msg { padding: 1px 0; color: var(--text); }
  .msg.player { color: var(--text-player); }
  .msg.player::before { content: '> '; color: var(--text-player); }
  .msg.system { color: var(--text-system); }
  .msg.ascii {
    font-size: 10px;
    line-height: 1.15;
    letter-spacing: 0px;
    color: #333;
    white-space: pre;
    overflow-x: auto;
    background: rgba(0,0,0,0.05);
    padding: 4px 6px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.08);
  }

  /* Input row */
  #input-row {
    display: flex;
    align-items: center;
    padding: 2px 8px 2px 14px;
    background: var(--parchment);
    border-top: 1px solid var(--parchment-dark);
    min-height: 20px;
  }
  #input-label {
    color: var(--text);
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    margin-right: 4px;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-player);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 0;
  }

  /* Tab bar — bottom */
  #tabs {
    display: flex;
    background: var(--tab-bg);
    border-top: 2px solid var(--stone-dark);
    height: 28px;
    flex-shrink: 0;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.05);
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    color: #ccc;
    cursor: pointer;
    border-right: 1px solid var(--stone-dark);
    user-select: none;
    line-height: 1.1;
    padding: 0 2px;
  }
  .tab:last-child { border-right: none; }
  .tab:hover { background: rgba(255,255,255,0.05); }
  .tab.active { color: var(--gold); background: var(--tab-active); }
  .tab small { color: var(--tab-on); font-size: 8px; }
  .tab.report { color: #fff; background: #802020; font-weight: bold; }
  .tab.report:hover { background: #a03030; }

  /* Quick action pills (above tabs) */
  #quick-bar {
    display: flex;
    background: var(--stone-dark);
    padding: 3px 4px;
    gap: 3px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .qbtn {
    background: var(--tab-bg);
    border: 1px solid var(--stone);
    color: var(--gold-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.08), inset -1px -1px 0 rgba(0,0,0,0.2);
  }
  .qbtn:hover { background: var(--tab-active); color: var(--gold); }
  .qbtn:active { box-shadow: inset -1px -1px 0 rgba(255,255,255,0.08), inset 1px 1px 0 rgba(0,0,0,0.2); }

  /* Timer display */
  #timer {
    background: #111;
    color: #aaa;
    font-family: var(--mono);
    font-size: 10px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--stone-dark);
  }

  /* Login overlay — OSRS-inspired stone castle entrance */
  #login-overlay {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* Stone wall background */
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, transparent 2px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.03) 0px, transparent 2px, transparent 64px),
      linear-gradient(180deg, #2a2520 0%, #3a352e 30%, #2a2520 60%, #1a1815 100%);
  }

  /* Stone pillars */
  #login-overlay::before, #login-overlay::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 60px;
    background:
      linear-gradient(90deg, #1a1815, #4a4438 20%, #5a5245 50%, #4a4438 80%, #1a1815);
    box-shadow: inset 2px 0 8px rgba(0,0,0,0.5), inset -2px 0 8px rgba(0,0,0,0.5);
  }
  #login-overlay::before { left: 10%; }
  #login-overlay::after { right: 10%; }

  /* Fire glow behind pillars */
  .fire-glow {
    position: absolute;
    top: 10%;
    width: 80px; height: 100px;
    border-radius: 50%;
    filter: blur(30px);
    animation: flicker 2s ease-in-out infinite alternate;
  }
  .fire-glow.left { left: 6%; background: rgba(255, 120, 20, 0.4); }
  .fire-glow.right { right: 6%; background: rgba(255, 120, 20, 0.4); animation-delay: 0.5s; }
  @keyframes flicker {
    0% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0.7; transform: scale(0.95); }
  }

  /* Title */
  #login-title {
    position: relative;
    z-index: 10;
    margin-bottom: 8px;
  }
  #login-title h1 {
    font-size: 48px;
    color: transparent;
    letter-spacing: 6px;
    font-weight: bold;
    /* Stone text effect */
    background: linear-gradient(180deg, #8a8070 0%, #6a6055 40%, #5a5245 60%, #4a4438 100%);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: 2px 3px 4px rgba(0,0,0,0.8);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.6));
  }

  /* Login box — stone panel */
  #login-box {
    position: relative;
    z-index: 10;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.03), transparent 50%),
      linear-gradient(180deg, #4a4438, #3a352e 30%, #35302a 70%, #2a2520);
    border: 3px solid #1a1815;
    border-radius: 6px;
    padding: 24px 40px;
    min-width: 280px;
    text-align: center;
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,0.08),
      inset -1px -1px 0 rgba(0,0,0,0.3),
      0 8px 32px rgba(0,0,0,0.6);
  }

  #login-box .welcome {
    color: #c8b88a;
    font-size: 14px;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  #login-box input {
    display: block;
    width: 100%;
    background: #1a1815;
    border: 2px solid #555040;
    color: #c8b88a;
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 12px;
    text-align: center;
    outline: none;
    margin-bottom: 12px;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
  }
  #login-box input:focus { border-color: var(--gold); }
  #login-box input::placeholder { color: #555; }

  #login-box .play-btn {
    display: block;
    width: 100%;
    background: linear-gradient(180deg, #4a4438, #3a352e);
    color: #fff;
    border: 2px solid #555040;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: bold;
    padding: 10px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,0.1),
      inset -1px -1px 0 rgba(0,0,0,0.3);
    transition: all 0.15s;
  }
  #login-box .play-btn:hover {
    background: linear-gradient(180deg, #5a5448, #4a443e);
    border-color: var(--gold);
    color: var(--gold);
  }
  #login-box .play-btn:active {
    box-shadow: inset -1px -1px 0 rgba(255,255,255,0.1), inset 1px 1px 0 rgba(0,0,0,0.3);
  }

  #login-box .player-name {
    color: #888;
    font-size: 11px;
    margin-top: 8px;
  }

  /* World selector */
  #world-badge {
    position: absolute;
    bottom: 12px;
    left: 12px;
    z-index: 10;
    background: #111;
    border: 1px solid #333;
    padding: 4px 10px;
    font-size: 10px;
    color: #aaa;
    cursor: pointer;
  }
  #world-badge:hover { color: #fff; border-color: #555; }
  #world-badge span { color: var(--gold); }

  /* Domain */
  .login-domain {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 10;
    color: #333;
    font-size: 9px;
    letter-spacing: 1px;
  }

  /* Fog at bottom */
  #login-fog {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(0deg, rgba(20,18,15,0.9), transparent);
    z-index: 5;
  }

  /* Desktop: side by side */
  @media (min-width: 768px) {
    #game-container { max-width: 520px; height: 100dvh; }
  }
  @media (max-width: 400px) {
    #chat-log { font-size: 11px; }
    .msg.ascii { font-size: 9px; }
    .tab { font-size: 9px; }
  }
</style>
</head>
<body>

<!-- No login overlay — login happens inline in chat -->

<div id="game-container">
  <!-- OSRS-style chatbox — fullscreen -->
  <div id="chatbox">
    <div id="chat-log"></div>
    <div id="input-row">
      <span id="input-label"></span>
      <input id="input" type="text" placeholder="" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <!-- Quick actions -->
  <div id="quick-bar">
    <button class="qbtn" onclick="input.value='? ';input.focus()">?</button>
    <button class="qbtn" onclick="send('/?')">/?</button>
    <button class="qbtn" onclick="send('n')">N</button>
    <button class="qbtn" onclick="send('s')">S</button>
    <button class="qbtn" onclick="send('e')">E</button>
    <button class="qbtn" onclick="send('w')">W</button>
    <button class="qbtn" onclick="send('inv')">Inv</button>
    <button class="qbtn" onclick="send('map')">Map</button>
    <button class="qbtn" onclick="send('status')">Stats</button>
    <button class="qbtn" onclick="send('look')">Look</button>
  </div>

  <!-- OSRS-style tabs -->
  <div id="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="game">Game<br><small>On</small></div>
    <div class="tab" data-filter="public">Public<br><small>On</small></div>
    <div class="tab" data-filter="private">Private<br><small>On</small></div>
    <div class="tab" data-filter="channel">Channel<br><small>On</small></div>
    <div class="tab" data-filter="clan">Clan<br><small>On</small></div>
    <div class="tab" data-filter="trade">Trade<br><small>On</small></div>
    <div id="timer">00:00:00</div>
  </div>
</div>

<script>
const chatLog = document.getElementById('chat-log');
const input = document.getElementById('input');
const inputLabel = document.getElementById('input-label');
// No login overlay — inline login via chat
// Maps render inline in chat
const timerEl = document.getElementById('timer');

let ws = null;
let playerName = '';
let connected = false;
let loginTime = 0;

function isAscii(text) {
  const lines = text.split('\n');
  if (lines.length < 5) return false;
  if (text.includes('Legend:') && text.includes('@')) return true;
  if (text.includes(' v ') && text.includes(' > ')) return true;
  // Check if multiple lines have similar length (grid-like)
  const lens = lines.filter(l => l.length > 5).map(l => l.length);
  if (lens.length >= 5) {
    const avg = lens.reduce((a,b) => a+b, 0) / lens.length;
    const similar = lens.filter(l => Math.abs(l - avg) < 5).length;
    if (similar > lens.length * 0.5) return true;
  }
  return false;
}

function addMsg(text, type) {
  // ASCII maps render inline in chat with special styling

  const div = document.createElement('div');
  const ascii = type === 'game' && isAscii(text);
  div.className = `msg ${type}${ascii ? ' ascii' : ''}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;

  // Keep log manageable
  while (chatLog.children.length > 200) chatLog.removeChild(chatLog.firstChild);
}

function send(cmd) {
  if (!ws || !connected) return;
  ws.send(cmd);
  addMsg(cmd, 'player');
}

function sendInput() {
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  if (!loggedIn) {
    handleLogin(val);
    return;
  }
  send(val);
}

function connect() {
  const host = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? `ws://${location.hostname}:2223`
    : `ws://${location.host}`;

  ws = new WebSocket(host);

  ws.onopen = () => {
    connected = true;
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.text) {
      if (msg.text.includes('Type `login [name]`')) return; // suppress server welcome
      addMsg(msg.text, 'game');
    }
  };

  ws.onclose = () => {
    connected = false;
    addMsg('Connection lost.', 'system');
    setTimeout(() => location.reload(), 3000);
  };
}

let loggedIn = false;

function doLogin() {
  // Not used — login happens inline
}

// Auto-connect on page load, login via chat input
function autoConnect() {
  addMsg('Welcome to Scape. Type your name to begin.', 'system');
  input.placeholder = 'enter your name...';
}

function handleLogin(name) {
  playerName = name || `Player${Math.floor(Math.random() * 9999)}`;
  inputLabel.textContent = playerName + ':';
  input.placeholder = '';
  addMsg(playerName, 'player');
  addMsg('Connecting...', 'system');
  loginTime = Date.now();
  connect();
  const waitLogin = setInterval(() => {
    if (connected) {
      loggedIn = true;
      ws.send(`login ${playerName}`);
      clearInterval(waitLogin);
    }
  }, 100);
}

// Start immediately — just show prompt, don't connect yet
setTimeout(autoConnect, 100);

// Timer
setInterval(() => {
  if (!loginTime) return;
  const elapsed = Math.floor((Date.now() - loginTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  timerEl.textContent = `${h}:${m}:${s}`;
}, 1000);

// Tab switching (visual only for now)
document.querySelectorAll('.tab[data-filter]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendInput(); });
document.addEventListener('keydown', (e) => {
  if (e.target === input) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) input.focus();
});
</script>
</body>
</html>
