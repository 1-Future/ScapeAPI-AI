<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scaleable=no">
<title>Scape — sc4p3.com</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #terminal { flex: 1; }
  .xterm { height: 100%; }
</style>
</head>
<body>
<div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
const term = new Terminal({
  cursorBlink: true,
  cursorStyle: 'block',
  fontFamily: "'Courier New', 'Consolas', monospace",
  fontSize: 14,
  theme: {
    background: '#0a0a0a',
    foreground: '#feff01',
    cursor: '#feff01',
    cursorAccent: '#000',
    selectionBackground: '#feff0133',
  },
  scrollback: 5000,
  convertEol: true,
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
window.addEventListener('resize', () => fitAddon.fit());

let ws = null;
let connected = false;
let inputBuffer = '';
let loggedIn = false;
let loginStep = 'name'; // name → password → done
let pendingName = '';
let passwordMode = false;

// ── Write helpers ─────────────────────────────────────────────────────────
function writeLine(text) {
  term.writeln(text);
}

function writePrompt() {
  if (!loggedIn) {
    if (loginStep === 'name') term.write('\x1b[33mName: \x1b[0m');
    else term.write('\x1b[33mPassword: \x1b[0m');
  } else {
    term.write(`\x1b[33m${pendingName}:\x1b[0m `);
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────
function connect() {
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = isLocal ? `ws://${location.hostname}:2223` : `${proto}//${location.host}`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    connected = true;
    writeLine('\x1b[32mConnected.\x1b[0m');
    writePrompt();
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (!msg.text) return;

    // Suppress server login prompts
    if (msg.text.includes('Type `login [name]`')) return;
    if (msg.text.includes('Please login first')) return;

    // Handle auth flow
    if (msg.text.includes('is taken') || msg.text.includes('already logged in')) {
      writeLine(`\x1b[31m${msg.text}\x1b[0m`);
      loginStep = 'name'; loggedIn = false; passwordMode = false;
      writePrompt();
      return;
    }
    if (msg.text.includes('No account') && ws._pendingPw) {
      ws.send(`register ${pendingName} ${ws._pendingPw}`);
      ws._pendingPw = null;
      return;
    }
    if (msg.text.includes('Wrong password')) {
      writeLine(`\x1b[31mWrong password.\x1b[0m`);
      loginStep = 'password'; passwordMode = true;
      writePrompt();
      return;
    }
    if (msg.text.includes('Account') && msg.text.includes('created')) {
      writeLine(`\x1b[32mAccount created!\x1b[0m`);
    }
    if (msg.text.includes('Logged in as') && !loggedIn) {
      loggedIn = true;
      passwordMode = false;
      writeLine(`\x1b[32m${msg.text}\x1b[0m`);
      // Auto-request map
      setTimeout(() => ws.send('map'), 300);
      writePrompt();
      return;
    }

    // Colorize game output
    let text = msg.text;
    // Damage in red
    text = text.replace(/(\d+) damage/g, '\x1b[31m$1 damage\x1b[0m');
    // HP color
    text = text.replace(/HP: (\d+)\/(\d+)/g, (m, cur, max) => {
      const ratio = parseInt(cur) / parseInt(max);
      const c = ratio > 0.5 ? '32' : ratio > 0.25 ? '33' : '31';
      return `HP: \x1b[${c}m${cur}/${max}\x1b[0m`;
    });
    // XP in green
    text = text.replace(/\+(\d+[\.\d]*)\s*([A-Za-z]+)\s*XP/g, '\x1b[32m+$1 $2 XP\x1b[0m');
    // Level ups in yellow
    text = text.replace(/(Congratulations!.*)/g, '\x1b[33;1m$1\x1b[0m');
    // Death in red
    text = text.replace(/(Oh dear, you are dead!)/g, '\x1b[31;1m$1\x1b[0m');
    // Achievement in yellow
    text = text.replace(/(Achievement unlocked:.*)/g, '\x1b[33;1m$1\x1b[0m');
    // Loot in cyan
    text = text.replace(/(Loot: .+)/g, '\x1b[36m$1\x1b[0m');

    // Write each line
    const lines = text.split('\n');
    for (const line of lines) {
      writeLine(line);
    }
    writePrompt();
  };

  ws.onclose = () => {
    connected = false;
    writeLine('\x1b[31mDisconnected. Refreshing...\x1b[0m');
    setTimeout(() => location.reload(), 3000);
  };
}

// ── Input handling ────────────────────────────────────────────────────────
term.onKey(({ key, domEvent }) => {
  const code = domEvent.keyCode;

  if (code === 13) { // Enter
    term.writeln('');
    handleInput(inputBuffer);
    inputBuffer = '';
    return;
  }

  if (code === 8) { // Backspace
    if (inputBuffer.length > 0) {
      inputBuffer = inputBuffer.slice(0, -1);
      term.write('\b \b');
    }
    return;
  }

  // Printable characters
  if (key.length === 1 && !domEvent.ctrlKey && !domEvent.altKey && !domEvent.metaKey) {
    inputBuffer += key;
    if (passwordMode) {
      term.write('•');
    } else {
      term.write(key);
    }
  }
});

function handleInput(input) {
  const val = input.trim();
  if (!val) { writePrompt(); return; }

  if (!loggedIn) {
    if (loginStep === 'name') {
      pendingName = val;
      if (pendingName.length < 2 || pendingName.length > 20) {
        writeLine('\x1b[31mName must be 2-20 characters.\x1b[0m');
        writePrompt();
        return;
      }
      loginStep = 'password';
      passwordMode = true;
      if (!connected) connect();
      writePrompt();
    } else if (loginStep === 'password') {
      if (val.length < 3) {
        writeLine('\x1b[31mPassword must be at least 3 characters.\x1b[0m');
        writePrompt();
        return;
      }
      passwordMode = false;
      if (!connected) {
        connect();
        const w = setInterval(() => {
          if (connected) {
            ws.send(`login ${pendingName} ${val}`);
            ws._pendingPw = val;
            clearInterval(w);
          }
        }, 100);
      } else {
        ws.send(`login ${pendingName} ${val}`);
        ws._pendingPw = val;
      }
    }
    return;
  }

  // Logged in — send command
  if (connected) ws.send(val);
}

// ── Startup ───────────────────────────────────────────────────────────────
writeLine('');
writeLine('\x1b[33;1m  ╔═══════════════════════════╗\x1b[0m');
writeLine('\x1b[33;1m  ║        S C A P E          ║\x1b[0m');
writeLine('\x1b[33;1m  ║   command-based mmorpg     ║\x1b[0m');
writeLine('\x1b[33;1m  ╚═══════════════════════════╝\x1b[0m');
writeLine('');
writeLine('  \x1b[2mMove:\x1b[0m n s e w ne nw se sw');
writeLine('  \x1b[2mInteract:\x1b[0m [1-8] for nearby things');
writeLine('  \x1b[2mAI Guide:\x1b[0m ? [question]');
writeLine('  \x1b[2mOptions:\x1b[0m /? for smart menu');
writeLine('  \x1b[2mHelp:\x1b[0m help');
writeLine('');
writeLine('  \x1b[2msc4p3.com\x1b[0m');
writeLine('');

connect();
</script>
</body>
</html>
