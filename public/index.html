<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scape</title>
<style>
  :root {
    --bg: #0a0a0a;
    --chat-bg: #111;
    --player-bubble: #1a1a2e;
    --game-bubble: #162016;
    --player-border: #2a2a4e;
    --game-border: #2a402a;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #feff01;
    --input-bg: #1a1a1a;
    --input-border: #333;
    --mono: 'Courier New', 'Consolas', 'Liberation Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  #header {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  #header .status {
    font-size: 11px;
    color: var(--text-dim);
  }
  #header .status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #555;
    margin-right: 4px;
    vertical-align: middle;
  }
  #header .status .dot.online { background: #4a4; box-shadow: 0 0 4px #4a4; }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  /* Bubbles */
  .bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble.player {
    align-self: flex-end;
    background: var(--player-bubble);
    border: 1px solid var(--player-border);
    border-bottom-right-radius: 4px;
    color: #c0c0ff;
  }

  .bubble.game {
    align-self: flex-start;
    background: var(--game-bubble);
    border: 1px solid var(--game-border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  /* ASCII content (maps, tables) gets special treatment */
  .bubble.game.ascii {
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: 0.5px;
    max-width: 95%;
    background: #0d0d0d;
    border-color: #222;
    padding: 6px 8px;
  }

  /* System messages */
  .bubble.system {
    align-self: center;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
    max-width: 90%;
  }

  /* Timestamps */
  .timestamp {
    font-size: 9px;
    color: #444;
    margin-top: 2px;
  }
  .bubble.player .timestamp { text-align: right; }

  /* Input area */
  #input-area {
    background: var(--input-bg);
    border-top: 1px solid var(--input-border);
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    border-radius: 20px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 16px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: #555; }

  #send-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: bold;
  }
  #send-btn:hover { opacity: 0.8; }
  #send-btn:active { transform: scale(0.95); }

  /* Login overlay */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 16px;
  }
  #login-overlay h1 {
    font-size: 36px;
    color: var(--accent);
    letter-spacing: 4px;
  }
  #login-overlay .subtitle {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 16px;
  }
  #login-overlay input {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 12px 20px;
    width: 260px;
    text-align: center;
    outline: none;
  }
  #login-overlay input:focus { border-color: var(--accent); }
  #login-overlay button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: bold;
    padding: 10px 32px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #login-overlay button:hover { opacity: 0.85; }
  #login-overlay .domain {
    position: absolute;
    bottom: 16px;
    color: #333;
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* Quick actions bar */
  #quick-bar {
    display: none;
    background: #111;
    border-top: 1px solid #1a1a1a;
    padding: 6px 8px;
    gap: 4px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  #quick-bar.visible { display: flex; }
  .quick-btn {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .quick-btn:hover { background: #252525; color: var(--text); border-color: #444; }
  .quick-btn:active { background: #333; }

  /* Responsive */
  @media (min-width: 768px) {
    #chat { padding: 16px 10%; }
    .bubble { max-width: 70%; font-size: 13px; }
    .bubble.ascii { max-width: 80%; }
  }
  @media (max-width: 400px) {
    .bubble { font-size: 12px; padding: 6px 10px; }
    .bubble.ascii { font-size: 9px; }
    #input { font-size: 13px; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div id="login-overlay">
  <h1>SCAPE</h1>
  <div class="subtitle">command-based mmorpg</div>
  <input id="login-name" type="text" placeholder="enter your name" maxlength="20" autocomplete="off" spellcheck="false">
  <button onclick="doLogin()">PLAY</button>
  <div class="domain">sc4p3.com</div>
</div>

<div id="header">
  <h1>SCAPE</h1>
  <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting...</span></div>
</div>

<div id="chat"></div>

<div id="quick-bar">
  <button class="quick-btn" onclick="send('/?')">/?</button>
  <button class="quick-btn" onclick="send('map')">map</button>
  <button class="quick-btn" onclick="send('inv')">inv</button>
  <button class="quick-btn" onclick="send('status')">status</button>
  <button class="quick-btn" onclick="send('nearby')">nearby</button>
  <button class="quick-btn" onclick="send('skills')">skills</button>
  <button class="quick-btn" onclick="send('look')">look</button>
</div>

<div id="input-area">
  <input id="input" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false">
  <button id="send-btn" onclick="sendInput()">&#9654;</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const loginOverlay = document.getElementById('login-overlay');
const loginName = document.getElementById('login-name');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const quickBar = document.getElementById('quick-bar');

let ws = null;
let playerName = '';
let connected = false;

// Detect if content is ASCII art (maps, tables)
function isAscii(text) {
  if (text.includes('@') && text.includes('Legend:')) return true;
  if (text.includes('──') && text.length > 50) return true;
  if ((text.match(/[.=#~XSTDP!?@]/g) || []).length > text.length * 0.3 && text.includes('\n')) return true;
  return false;
}

function addBubble(text, type) {
  const div = document.createElement('div');
  const isAsciiContent = type === 'game' && isAscii(text);
  div.className = `bubble ${type}${isAsciiContent ? ' ascii' : ''}`;
  div.textContent = text;

  const ts = document.createElement('div');
  ts.className = 'timestamp';
  ts.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.appendChild(ts);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function send(cmd) {
  if (!ws || !connected) return;
  ws.send(cmd);
  addBubble(cmd, 'player');
}

function sendInput() {
  const val = input.value.trim();
  if (!val) return;
  send(val);
  input.value = '';
  input.focus();
}

function connect() {
  const host = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? `ws://${location.hostname}:2223`
    : `ws://${location.host}`;

  ws = new WebSocket(host);

  ws.onopen = () => {
    connected = true;
    statusDot.classList.add('online');
    statusText.textContent = 'connected';
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.text) {
      // Skip the welcome message before login
      if (msg.text.includes('Welcome to Scape') && loginOverlay.style.display !== 'none') return;
      addBubble(msg.text, 'game');
    }
  };

  ws.onclose = () => {
    connected = false;
    statusDot.classList.remove('online');
    statusText.textContent = 'disconnected';
    addBubble('Connection lost. Refreshing...', 'system');
    setTimeout(() => location.reload(), 3000);
  };

  ws.onerror = () => {
    statusText.textContent = 'error';
  };
}

function doLogin() {
  playerName = loginName.value.trim() || `Player${Math.floor(Math.random() * 9999)}`;
  loginOverlay.style.display = 'none';
  quickBar.classList.add('visible');
  connect();
  // Wait for connection then login
  const waitLogin = setInterval(() => {
    if (connected) {
      ws.send(`login ${playerName}`);
      clearInterval(waitLogin);
    }
  }, 100);
}

// Enter key handlers
loginName.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendInput();
  // Arrow up for command history (future)
});

// Focus input on any key press
document.addEventListener('keydown', (e) => {
  if (loginOverlay.style.display !== 'none') return;
  if (e.target === input) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    input.focus();
  }
});
</script>
</body>
</html>
