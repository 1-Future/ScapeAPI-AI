<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scape</title>
<style>
  :root {
    --parchment: #c8b88a;
    --parchment-dark: #b0a070;
    --stone: #5c5445;
    --stone-dark: #3a352e;
    --stone-light: #7a7060;
    --gold: #ff981f;
    --gold-dim: #c8842a;
    --text: #000;
    --text-system: #0000aa;
    --text-player: #000099;
    --tab-bg: #3b3024;
    --tab-active: #5a4a35;
    --tab-on: #00cc00;
    --mono: 'Courier New', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: var(--mono);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #game {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  /* ── Map pane (top) ─────────────────────────────────────── */
  #map-pane {
    background: #1a1510;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    height: 45%;
    min-height: 60px;
    position: relative;
  }
  #map-content {
    font-family: var(--mono);
    color: #333;
    white-space: pre;
    line-height: 1.2;
    text-align: left;
    display: inline-block;
  }
  #map-pane.empty { display: flex; align-items: center; justify-content: center; }
  #map-pane.empty::after { content: 'Type your name below to begin.'; color: #333; font-size: 12px; }
  #map-area {
    font-size: 11px;
    color: #555;
    position: absolute;
    bottom: 4px;
    right: 8px;
  }

  /* ── Drag handle + legend ────────────────────────────────── */
  #divider {
    background: linear-gradient(180deg, var(--stone-dark), var(--stone) 30%, var(--stone) 70%, var(--stone-dark));
    cursor: ns-resize;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    padding: 2px 8px;
    min-height: 16px;
    gap: 6px;
  }
  #legend {
    font-size: 9px;
    color: var(--parchment-dark);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    overflow: hidden;
  }
  .lk {
    display: flex;
    align-items: center;
    gap: 1px;
    padding: 0 3px;
  }
  .ls {
    font-weight: bold;
    font-size: 10px;
    width: 10px;
    text-align: center;
  }
  #divider .grip {
    width: 30px;
    height: 2px;
    background: rgba(255,255,255,0.12);
    border-radius: 1px;
    flex-shrink: 0;
  }
  #divider .zoom-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--parchment-dark);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: bold;
    width: 18px; height: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    flex-shrink: 0;
    padding: 0;
  }
  #divider .zoom-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

  /* ── Chat pane (bottom) ─────────────────────────────────── */
  #chat-pane {
    flex: 1;
    background: var(--parchment);
    display: flex;
    flex-direction: column;
    min-height: 80px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  }

  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    scrollbar-width: thin;
    scrollbar-color: var(--stone) var(--parchment-dark);
  }
  #chat-log::-webkit-scrollbar { width: 10px; }
  #chat-log::-webkit-scrollbar-track { background: var(--parchment-dark); }
  #chat-log::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--stone-light), var(--stone), var(--stone-dark));
    border: 1px solid var(--stone-dark);
  }

  .msg { padding: 2px 0; font-size: 13px; line-height: 1.4; }
  .msg.player { color: #00449e; font-weight: bold; }
  .msg.player::before { content: '> '; }
  .msg.system { color: #6a00aa; font-style: italic; }
  /* Color key words in game messages for scannability */
  .msg.game { color: #1a1a1a; }

  #input-row {
    display: flex;
    align-items: center;
    padding: 2px 10px;
    background: var(--parchment);
    border-top: 1px solid var(--parchment-dark);
  }
  #input-label {
    color: var(--text);
    font-size: 12px;
    font-weight: bold;
    margin-right: 4px;
    white-space: nowrap;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-player);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 0;
  }

  /* ── Quick bar ──────────────────────────────────────────── */
  #quick-bar {
    display: flex;
    background: var(--stone-dark);
    padding: 3px 4px;
    gap: 3px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .qbtn {
    background: var(--tab-bg);
    border: 1px solid var(--stone);
    color: var(--gold-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.08), inset -1px -1px 0 rgba(0,0,0,0.2);
  }
  .qbtn:hover { background: var(--tab-active); color: var(--gold); }
  .qbtn:active { box-shadow: inset -1px -1px 0 rgba(255,255,255,0.08), inset 1px 1px 0 rgba(0,0,0,0.2); }

  /* ── Tab bar ────────────────────────────────────────────── */
  #tabs {
    display: flex;
    background: var(--tab-bg);
    border-top: 2px solid var(--stone-dark);
    height: 28px;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    color: #ccc;
    cursor: pointer;
    border-right: 1px solid var(--stone-dark);
    user-select: none;
    line-height: 1.1;
  }
  .tab:last-child { border-right: none; }
  .tab:hover { background: rgba(255,255,255,0.05); }
  .tab.active { color: var(--gold); background: var(--tab-active); }
  .tab small { color: var(--tab-on); font-size: 8px; }
  #timer {
    background: #111;
    color: #aaa;
    font-size: 10px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--stone-dark);
  }

  @media (min-width: 768px) {
    #game { max-width: 520px; }
  }
  @media (max-width: 400px) {
    #chat-log { font-size: 11px; }
    .qbtn { font-size: 9px; padding: 2px 6px; }
  }
</style>
</head>
<body>
<div id="game">
  <!-- Map pane -->
  <div id="map-pane" class="empty">
    <div id="map-content"></div>
    <div id="map-area"></div>
  </div>

  <!-- Draggable divider + legend -->
  <div id="divider">
    <button class="zoom-btn" onclick="zoomMap(-1)">-</button>
    <div class="grip"></div>
    <div id="legend"><span class="lk"><span class="ls" style="color:#fff">@</span>You</span><span class="lk"><span class="ls" style="color:#e44">!</span>NPC</span><span class="lk"><span class="ls" style="color:#e90">?</span>Obj</span><span class="lk"><span class="ls" style="color:#4af">P</span>Ply</span><span class="lk"><span class="ls" style="color:#888">#</span>Wall</span><span class="lk"><span class="ls" style="color:#2a2">T</span>Tree</span><span class="lk"><span class="ls" style="color:#48f">~</span>Wtr</span><span class="lk"><span class="ls" style="color:#6a4">.</span>Grs</span><span class="lk"><span class="ls" style="color:#ca0">=</span>Path</span><span class="lk"><span class="ls" style="color:#da0">S</span>Sand</span></div>
    <div class="grip"></div>
    <button class="zoom-btn" onclick="zoomMap(1)">+</button>
  </div>

  <!-- Chat pane -->
  <div id="chat-pane">
    <div id="chat-log"></div>
    <div id="input-row">
      <span id="input-label"></span>
      <input id="input" type="text" placeholder="" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <!-- Quick actions -->
  <div id="quick-bar">
    <button class="qbtn" onclick="input.value='? ';input.focus()">?</button>
    <button class="qbtn" onclick="send('/?')">/?</button>
    <button class="qbtn" onclick="send('n')">N</button>
    <button class="qbtn" onclick="send('s')">S</button>
    <button class="qbtn" onclick="send('e')">E</button>
    <button class="qbtn" onclick="send('w')">W</button>
    <button class="qbtn" onclick="send('inv')">Inv</button>
    <button class="qbtn" onclick="send('map')">Map</button>
    <button class="qbtn" onclick="send('status')">Stats</button>
    <button class="qbtn" onclick="send('look')">Look</button>
  </div>

  <!-- Tabs -->
  <div id="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="game">Game<br><small>On</small></div>
    <div class="tab" data-filter="public">Public<br><small>On</small></div>
    <div class="tab" data-filter="private">Private<br><small>On</small></div>
    <div class="tab" data-filter="channel">Channel<br><small>On</small></div>
    <div class="tab" data-filter="clan">Clan<br><small>On</small></div>
    <div class="tab" data-filter="trade">Trade<br><small>On</small></div>
    <div id="timer">00:00:00</div>
  </div>
</div>

<script>
const mapPane = document.getElementById('map-pane');
const mapContent = document.getElementById('map-content');
const mapArea = document.getElementById('map-area');
const chatLog = document.getElementById('chat-log');
const input = document.getElementById('input');
const inputLabel = document.getElementById('input-label');
const divider = document.getElementById('divider');
const timerEl = document.getElementById('timer');
const game = document.getElementById('game');

let ws = null, playerName = '', connected = false, loggedIn = false, loginTime = 0;

// ── Draggable divider ─────────────────────────────────────────────────────
let dragging = false, startY = 0, startHeight = 0;

divider.addEventListener('mousedown', (e) => { startDrag(e.clientY); e.preventDefault(); });
divider.addEventListener('touchstart', (e) => { startDrag(e.touches[0].clientY); e.preventDefault(); }, { passive: false });

function startDrag(y) { dragging = true; startY = y; startHeight = mapPane.offsetHeight; }

document.addEventListener('mousemove', (e) => { if (dragging) doDrag(e.clientY); });
document.addEventListener('touchmove', (e) => { if (dragging) doDrag(e.touches[0].clientY); }, { passive: true });

function doDrag(y) {
  const delta = y - startY;
  const newHeight = Math.max(60, Math.min(game.offsetHeight - 120, startHeight + delta));
  mapPane.style.height = newHeight + 'px';
  scaleMap();
}

document.addEventListener('mouseup', () => { dragging = false; });
document.addEventListener('touchend', () => { dragging = false; });

// ── Map scaling — fit ASCII to pane width ─────────────────────────────────
let mapZoomOffset = 0;

function scaleMap() {
  const text = mapContent.textContent;
  if (!text) return;
  const lines = text.split('\n').filter(l => l.length > 0);
  const maxLen = Math.max(...lines.map(l => l.length));
  if (maxLen === 0 || lines.length === 0) return;

  const paneWidth = mapPane.clientWidth - 8;
  const paneHeight = mapPane.clientHeight - 8;

  const charW = 0.602;
  const lineH = 1.2;

  const fontFromWidth = paneWidth / (maxLen * charW);
  const fontFromHeight = paneHeight / (lines.length * lineH);

  const autoSize = Math.min(fontFromWidth, fontFromHeight);
  const fontSize = Math.max(4, autoSize + mapZoomOffset);
  mapContent.style.fontSize = fontSize + 'px';
}

function zoomMap(dir) {
  mapZoomOffset += dir * 2;
  scaleMap();
}

// ── ASCII detection ───────────────────────────────────────────────────────
function isAscii(text) {
  const lines = text.split('\n');
  if (lines.length < 5) return false;
  if (text.includes('Legend:') && text.includes('@')) return true;
  if (text.includes(' v ') && text.includes(' > ')) return true;
  const lens = lines.filter(l => l.length > 5).map(l => l.length);
  if (lens.length >= 5) {
    const avg = lens.reduce((a,b) => a+b, 0) / lens.length;
    const similar = lens.filter(l => Math.abs(l - avg) < 5).length;
    if (similar > lens.length * 0.5) return true;
  }
  return false;
}

// ── Chat messages ─────────────────────────────────────────────────────────
function addMsg(text, type) {
  // ASCII goes to map pane
  if (type === 'game' && isAscii(text)) {
    mapPane.classList.remove('empty');
    // Extract area name
    const areaMatch = text.match(/Area:\s*(.+)/);
    if (areaMatch) mapArea.textContent = areaMatch[1];
    // Strip legend, area, and coords — keep only the grid
    let gridLines = text.split('\n').filter(line => {
      if (line.includes('Legend:')) return false;
      if (line.includes('~ Water') || line.includes('Grass/Floor')) return false;
      if (line.includes('Area:')) return false;
      if (line.trim() === '') return false;
      return true;
    });
    // Remove leading coord line if it's just "(x, y) — N steps left"
    if (gridLines[0] && /^\(?\d+,\s*\d+\)/.test(gridLines[0].trim())) gridLines.shift();
    // Color-code the map characters
    const colorMap = {
      '@': '#ffff00', '!': '#ff4444', '?': '#ff9900', 'P': '#44aaff',
      '#': '#999', 'T': '#33cc33', '~': '#4488ff', 'S': '#ddaa00',
      '=': '#ccaa00', 'D': '#cc8844', 'X': '#2a2520', 'b': '#33aa33',
      '*': '#ddf', '%': '#886633', ',': '#77aa55', '>': '#ffff00',
      'v': '#ffff00',
    };
    const gridText = gridLines.join('\n');
    let html = '';
    for (const ch of gridText) {
      if (ch === '\n') { html += '\n'; continue; }
      if (ch === ' ') { html += ' '; continue; }
      if (ch === '.') { html += '<span style="color:#4a6a3a">.</span>'; continue; }
      const c = colorMap[ch];
      if (c) html += `<span style="color:${c};font-weight:${ch === '@' || ch === '>' || ch === 'v' ? 'bold' : 'normal'}">${ch}</span>`;
      else html += `<span style="color:#555">${ch}</span>`;
    }
    mapContent.innerHTML = html;
    scaleMap();
    return;
  }

  const div = document.createElement('div');
  div.className = `msg ${type}`;

  if (type === 'game') {
    let html = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/(\d+) damage/g, '<span style="color:#b00;font-weight:bold">$1 damage</span>')
      .replace(/HP: (\d+)\/(\d+)/g, (m, cur, max) => {
        const ratio = parseInt(cur) / parseInt(max);
        const c = ratio > 0.5 ? '#060' : ratio > 0.25 ? '#a60' : '#b00';
        return `HP: <span style="color:${c};font-weight:bold">${cur}/${max}</span>`;
      })
      .replace(/\+(\d+[\.\d]*)\s*([A-Za-z]+)\s*XP/g, '<span style="color:#050;font-weight:bold">+$1 $2 XP</span>')
      .replace(/(Congratulations!.*)/g, '<span style="color:#a70;font-weight:bold">$1</span>')
      .replace(/(Oh dear, you are dead!)/g, '<span style="color:#b00;font-weight:bold">$1</span>')
      .replace(/(Achievement unlocked:.*)/g, '<span style="color:#a70;font-weight:bold">$1</span>')
      .replace(/(You are poisoned!)/g, '<span style="color:#080">$1</span>')
      .replace(/(Loot: .+)/g, '<span style="color:#964">$1</span>')
      .replace(/(Music unlocked: .+)/g, '<span style="color:#448">$1</span>')
      .replace(/(\[\d+\])/g, '<span style="color:#006;font-weight:bold">$1</span>');
    div.innerHTML = html;
  } else {
    div.textContent = text;
  }
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  while (chatLog.children.length > 200) chatLog.removeChild(chatLog.firstChild);
}

function send(cmd) {
  if (!ws || !connected) return;
  ws.send(cmd);
  addMsg(cmd, 'player');
}

function sendInput() {
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  if (!loggedIn) { handleLogin(val); return; }
  send(val);
}

function connect() {
  const host = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? `ws://${location.hostname}:2223` : `ws://${location.host}`;
  ws = new WebSocket(host);
  ws.onopen = () => { connected = true; };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.text) {
      if (msg.text.includes('Type `login [name]`')) return;
      addMsg(msg.text, 'game');
    }
  };
  ws.onclose = () => {
    connected = false;
    addMsg('Connection lost.', 'system');
    setTimeout(() => location.reload(), 3000);
  };
}

function handleLogin(name) {
  playerName = name || `Player${Math.floor(Math.random() * 9999)}`;
  inputLabel.textContent = playerName + ':';
  input.placeholder = '';
  addMsg(playerName, 'player');
  addMsg('Connecting...', 'system');
  loginTime = Date.now();
  connect();
  const w = setInterval(() => {
    if (connected) {
      loggedIn = true;
      ws.send(`login ${playerName}`);
      setTimeout(() => ws.send('map'), 500);
      clearInterval(w);
    }
  }, 100);
}

// Timer
setInterval(() => {
  if (!loginTime) return;
  const el = Math.floor((Date.now() - loginTime) / 1000);
  timerEl.textContent = `${String(Math.floor(el/3600)).padStart(2,'0')}:${String(Math.floor((el%3600)/60)).padStart(2,'0')}:${String(el%60).padStart(2,'0')}`;
}, 1000);

// Tabs
document.querySelectorAll('.tab[data-filter]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

// Input
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendInput(); });
document.addEventListener('keydown', (e) => {
  if (e.target === input) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) input.focus();
});

// Window resize
window.addEventListener('resize', scaleMap);

// Start
addMsg('Welcome to Scape. Type your name to begin.', 'system');
input.placeholder = 'enter your name...';
</script>
</body>
</html>
